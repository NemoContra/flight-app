<h1>Welcome!</h1>
<p>counter value: {{ count() }}</p>
<p>double counter value: {{ doubleCount() }}</p>
<button (click)="increment()">INC</button>
<button (click)="decrement()">DECR</button>
<button (click)="incrementBy2()">INC BY 2</button>
<button (click)="decrementBy2()">DECR BY 2</button>
<input (keydown)="onKeydownEnter($event)" />
