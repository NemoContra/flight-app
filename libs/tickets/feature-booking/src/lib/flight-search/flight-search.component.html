<div class="header">
  <h2 class="title">Flight Search</h2>
</div>

<form (submit)="search()" (reset)="reset()">
  <div class="form-group">
    <label>From:</label>
    <input [(ngModel)]="ctx().from" name="from" class="form-control" />
  </div>
  <div class="form-group">
    <label>To:</label>
    <input [(ngModel)]="ctx().to" name="to" class="form-control" />
  </div>

  <div class="form-group">
    <button type="submit" class="btn btn-default">Search</button>
  </div>
</form>

@let basket = flightFacade.basket();
<div class="row">
  @for(f of flightFacade.flights(); track f.id) {
  <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
    <app-flight-card
      [item]="f"
      [selected]="basket[f.id]"
      (selectedChange)="updateBasket(f.id)"
    >
      <p class="middle"><i>Delays are possible!</i></p>
      <p class="bottom"><small>Statement without guarantee!</small></p>
    </app-flight-card>
  </div>
  }
</div>

<p>&nbsp;</p>

<div>
  <pre>{{ basket | json }}</pre>
</div>
